# Installed as /etc/nginx/snippets/ba-recard.conf and included in the HTTPS
# server block (listen 443, server_name 110.42.238.185) of the site config:
#     include /etc/nginx/snippets/ba-recard.conf;
# https://110.42.238.185/ba-recard/api/... -> PostgREST on 127.0.0.1:3020
# (ba-recard-api.service). CORS headers come from PostgREST.

location = /ba-recard/api/rpc/login {
    limit_req zone=ba_recard_login burst=5 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:3020/rpc/login;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 30s;
}

# registering (needs an invite code) shares the login limit
location = /ba-recard/api/rpc/register {
    limit_req zone=ba_recard_login burst=5 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:3020/rpc/register;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 30s;
}

location ^~ /ba-recard/api/ {
    limit_req zone=ba_recard_api burst=100 nodelay;
    limit_req_status 429;
    client_max_body_size 8m;
    proxy_pass http://127.0.0.1:3020/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 60s;
}
